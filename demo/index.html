h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
p{margin:0 0 10px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink);font-weight:600}
:root[lang="vi"] .eyebrow{text-transform:none;letter-spacing:.02em}
.muted{color:var(--fg-soft)}.faint{color:var(--fg-faint);font-size:13px}
.sm{font-size:13px}

/* ---- frame ---- */
#head{position:sticky;top:0;z-index:20;height:var(--head-h);display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--rule-soft)}
#head .logo{width:40px;height:40px;border-radius:50%;box-shadow:0 2px 8px var(--shade);flex:none}
#head .name{font-family:var(--display);font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 6px;border-radius:15px;background:var(--surface);border:1px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap}
.pill svg{width:18px;height:18px}
.pill .sub{font-size:10px;font-weight:500;color:var(--fg-faint);margin-left:2px}
#main{min-height:calc(100vh - var(--head-h) - var(--nav-h));padding:14px 14px calc(var(--nav-h) + 20px)}
body.game #main{padding:0 0 12px;min-height:0}
body.game #nav{display:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--surface);border-top:1px solid var(--rule)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--fg-faint);font-size:12px;font-weight:600}
#nav a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav a.on{color:var(--primary)}
#nav a .dot{position:absolute;margin-left:22px;margin-top:-4px;width:9px;height:9px;border-radius:50%;background:var(--pink-ink);border:2px solid var(--surface)}

/* ---- components ---- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shade)}
.card.tint{background:var(--surface-2)}
.card h2{margin-bottom:4px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--surface-3);color:var(--fg);border:1px solid var(--rule);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.gold{background:var(--gold);color:#3B2A5E;border-color:var(--gold)}
.btn.pinkish{background:var(--pink);color:#5B2340;border-color:var(--pink)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.big{min-height:56px;font-size:18px;border-radius:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.btns{display:grid;gap:8px}
.btns.two{grid-template-columns:1fr 1fr}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--fg-soft)}
.chip svg{width:14px;height:14px}
.chip.gold{background:var(--gold-soft);color:#5C4312}.chip.pink{background:var(--pink);color:#5B2340}.chip.blue{background:var(--blue);color:#1F3A6B}.chip.mint{background:var(--mint);color:#1F5A32}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars .off{opacity:.25}
.hero{display:flex;gap:14px;align-items:center}
.hero svg.art{width:96px;height:96px;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.tile>svg{width:44px;height:44px}
a.tile{text-decoration:none;color:inherit}
.tile b{font-size:13px;line-height:1.2}
.tile .badge{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--pink-ink)}
.tile.done{opacity:.7}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:10px 18px;border-radius:14px;font-weight:600;z-index:60;box-shadow:0 6px 20px var(--shade);animation:toastin .25s ease-out;max-width:90vw;text-align:center}
body.game .toast{bottom:90px}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.overlay{position:fixed;inset:0;z-index:50;background:var(--shade);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.overlay.center{align-items:center;padding:16px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .25s ease-out}
.overlay.center .sheet{border-radius:24px;padding:22px 18px}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet h2{text-align:center;margin-bottom:6px}
.sheet .x{position:absolute;right:14px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--surface-3);font-size:18px}
.sheet{position:relative}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--rule-soft)}
.item>svg{width:40px;height:40px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block}.item .t span{font-size:13px;color:var(--fg-soft)}
.item .btn{min-height:38px;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg{display:flex;background:var(--surface-3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--fg-soft)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px var(--shade)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.kv:last-child{border-bottom:0}
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.sparkles i{position:absolute;width:6px;height:6px;background:var(--gold);border-radius:50%;opacity:.6;animation:twinkle 2.4s infinite}
@keyframes twinkle{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.2);opacity:.9}}

/* ---- level map ---- */
.chap{margin-bottom:14px}
.chap .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chap .head svg.thumb,.chap .head img.thumb{width:78px;height:65px;border-radius:12px;flex:none;border:1px solid var(--rule);object-fit:cover}
img.thumb{width:120px;height:100px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--rule)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl{aspect-ratio:1;border-radius:16px;background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:15px;position:relative}
.lvl .stars svg{width:11px;height:11px}
.lvl.lock{opacity:.45}
.lvl.next{border:2px solid var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.lvl.same{background:var(--gold-soft)}.lvl.mirror{background:var(--blue)}
.lvl .tag{position:absolute;top:-6px;right:-4px;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--pink-ink);color:#fff}
:root[data-theme="dark"] .lvl.same{color:#3B2A5E}:root[data-theme="dark"] .lvl.mirror{color:#1F3A6B}

/* ---- game ---- */
#gbar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg)}
#gbar .ttl{flex:1;min-width:0;line-height:1.2}
#gbar .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gbar .ttl span{font-size:12px;color:var(--fg-soft)}
#gbar .rnd{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:18px}
#timer{min-width:64px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}
#timer.low{color:var(--err);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#status{display:flex;justify-content:space-between;align-items:center;padding:0 14px 6px;font-size:13px;color:var(--fg-soft)}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface-3);border:1px solid var(--rule)}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.miss{display:flex;gap:3px}.miss i{width:10px;height:10px;border-radius:50%;background:var(--surface-3)}.miss i.on{background:var(--err)}
#pics{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px}
.picwrap{position:relative;width:min(100%,520px,calc((100vh - 230px) * .6));aspect-ratio:6/5;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px var(--shade);border:2px solid var(--surface);background:var(--surface-3)}
.picwrap svg.pic{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.picwrap img.ph{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.picwrap svg.marks-svg{pointer-events:none}
.picwrap .lbl{position:absolute;left:8px;top:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:rgba(255,249,250,.85);color:#3B2A5E;pointer-events:none}
.picwrap .mk{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
.mk.x{color:var(--err);font-size:26px;font-weight:800;animation:xpop .5s ease-out forwards;text-shadow:0 0 4px #fff}
@keyframes xpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-70%) scale(1.2);opacity:0}}
.mk.hintring{width:14%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--gold);animation:ringpulse .9s infinite}
@keyframes ringpulse{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.5}}
.found{animation:foundpop .35s ease-out}
@keyframes foundpop{from{stroke-width:14;opacity:0}to{stroke-width:4;opacity:1}}
#gtools{display:flex;gap:8px;padding:10px 12px 0;justify-content:center}
#gtools .btn{min-height:44px;padding:8px 12px;font-size:13px;flex:1;max-width:190px}
.tut{position:absolute;inset:0;background:rgba(59,42,94,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5;border-radius:12px}
.tut div{background:var(--surface);border-radius:16px;padding:14px 16px;text-align:center;font-weight:600;max-width:320px}
.result .big{font-size:56px;text-align:center;line-height:1}
.result .rs{display:flex;justify-content:center;gap:6px;margin:8px 0}
.result .rs svg{width:44px;height:44px;animation:starin .5s ease-out backwards}
.result .rs svg:nth-child(2){animation-delay:.15s}.result .rs svg:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}

/* ---- daily ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:.9;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--fg-soft)}
.cal .d svg{width:24px;height:24px}
.cal .d.got{background:var(--gold-soft);border-color:var(--gold)}
.cal .d.today{border:2px solid var(--primary)}
.cal .d b{font-size:12px;color:var(--fg)}
.wheelwrap{position:relative;width:min(78vw,300px);margin:6px auto}
.wheelwrap svg.wheel{width:100%;height:auto;display:block;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheelwrap .ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--primary);filter:drop-shadow(0 2px 2px var(--shade))}
.tcard{width:150px;height:230px;margin:0 auto;perspective:900px}
.tcard .in{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
.tcard.flip .in{transform:rotateY(180deg)}
.tcard .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px var(--shade)}
.tcard .f svg{width:100%;height:100%;display:block}
.tcard .f.back{transform:rotateY(180deg)}
.deck{display:flex;justify-content:center;gap:-20px;margin:8px 0}
.deck button{width:64px;height:100px;margin:0 -12px;transition:transform .2s}
.deck button:hover,.deck button:active{transform:translateY(-10px)}
.deck button svg{width:100%;height:100%}
.pop{animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.coin{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.coin svg{width:16px;height:16px}
.adbox{position:fixed;inset:0;z-index:70;background:#241A45;color:#F6F0FA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.adbox .count{font-size:40px;font-family:var(--display)}
.adbox .frame{width:min(80vw,320px);aspect-ratio:1;border-radius:20px;background:#312559;display:flex;align-items:center;justify-content:center;border:2px dashed #6B5C8A}
.adbox .frame svg{width:60%;height:60%}
.shopgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pack{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pack svg{width:48px;height:48px}
.pack b{font-size:14px}
.pack .btn{min-height:36px;padding:4px 10px;font-size:13px;width:100%}
.pack .best{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;padding:2px 8px;border-radius:8px;background:var(--pink-ink);color:#fff;white-space:nowrap}
footer{text-align:center;color:var(--fg-faint);font-size:12px;padding:20px 0 0}
</style>
</head>
<body>
<header id="head"></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
const PRIVACY = {"title": {"vi": "Chính sách riêng tư", "en": "Privacy policy"}, "updated": "2026-09-05", "intro": {"vi": "Nabu Twin Stars là game tìm điểm khác nhau của Nabu Tarot. Game không cần tài khoản và không hỏi tên, email hay ngày sinh của bạn.", "en": "Nabu Twin Stars is a spot-the-difference game by Nabu Tarot. It needs no account and never asks for your name, email or birthday."}, "sections": [{"h": {"vi": "Dữ liệu lưu trên máy", "en": "Data kept on your device"}, "p": {"vi": "Tiến trình chơi (sao, bụi sao, đá trăng, chuỗi điểm danh, cài đặt) được lưu ngay trên điện thoại của bạn. Chúng tôi không gửi dữ liệu này lên máy chủ. Xoá app hoặc bấm 'Xoá tiến trình' là dữ liệu mất.", "en": "Your progress (stars, Stardust, Moonstones, check-in streak, settings) is stored on your phone only. We do not send it to a server. Uninstalling the app or tapping 'Reset progress' deletes it."}}, {"h": {"vi": "Quảng cáo", "en": "Advertising"}, "p": {"vi": "Bản Android hiển thị quảng cáo qua Google AdMob: quảng cáo nhận thưởng (bạn tự chọn xem) và quảng cáo ngắn giữa một số màn. Google có thể thu thập mã quảng cáo của thiết bị và dữ liệu sử dụng để hiển thị và đo lường quảng cáo, theo chính sách riêng tư của Google (policies.google.com/privacy). Ở khu vực châu Âu, app hỏi ý kiến bạn trước và bạn có thể đổi lựa chọn trong Tôi → Tuỳ chọn quảng cáo. Mua 'Bỏ quảng cáo' sẽ tắt quảng cáo giữa các màn.", "en": "The Android version shows ads through Google AdMob: reward ads you choose to watch and short ads between some levels. Google may collect the device's advertising ID and usage data to serve and measure ads under Google's privacy policy (policies.google.com/privacy). In the European region the app asks for your consent first and you can change it under Me → Ad privacy options. Buying 'Remove ads' turns off the ads between levels."}}, {"h": {"vi": "Mua trong app", "en": "In-app purchases"}, "p": {"vi": "Mua hàng đi qua Google Play. Chúng tôi không thấy và không lưu thông tin tha    Things Nabu may change without touching the rest of the code. */
const CONFIG = {

/* ============================ motif library ============================
   Every picture in the game is drawn from these little vector motifs, in the
   same idiom as the Nabu logo: soft pastel fills, a deep-purple outline,
   rounded shapes, small gold sparkles. Each motif is drawn inside a 100 x 100
   box centred on the origin. `draw(c)` gets c.a (main colour), c.b (second
   colour) and c.v (variant number) and returns SVG.

   Metadata per motif:
     r     hit radius (also used to keep objects apart)
     sym   true when a mirror image looks the same (so "flip" is never used)
     zone  where it may be placed: 'sky' | 'ground' | 'any'
     vars  number of variants (variant changes are one kind of difference)
     nocolor  true when the main colour must not be changed (would look wrong) */

const INK = '#3D2A6E', CREAM = '#FFF9FA', PINK = '#F6BBCB', BLUE = '#AFC8F0', LAV = '#B8A4E3',
      GOLD = '#E5BE5E', MINT = '#CFEBD6', PEACH = '#F8C9A8', LILAC = '#D9CDF3', PLUM = '#5B3F9E',
      ROSE = '#E48AA6', SKYB = '#7FA7E6', LEAF = '#8CC49B', SAND = '#F1E1BF', WOOD = '#C98E5B',
      WHITE = '#FFFFFF', DEEP = '#3D2A6E', NIGHT = '#4B3684', GOLD2 = '#F6E5B3', RED = '#E27A6A';

/* Colours a difference may switch to. NEAR lists look-alike pairs used on
   subtle levels; FAR is any other swatch. */
const SWATCH = [PINK, BLUE, LAV, GOLD, MINT, PEACH, LILAC, ROSE, SKYB, LEAF, SAND, CREAM];
const NEAR = {
  [PINK]: [PEACH, ROSE, LILAC], [PEACH]: [PINK, SAND, GOLD2], [ROSE]: [PINK, RED],
  [BLUE]: [SKYB, LILAC, MINT], [SKYB]: [BLUE, LAV], [LILAC]: [LAV, BLUE, PINK],
  [LAV]: [LILAC, SKYB, PLUM], [GOLD]: [SAND, PEACH, GOLD2], [SAND]: [GOLD, CREAM, PEACH],
  [MINT]: [LEAF, BLUE, CREAM], [LEAF]: [MINT], [CREAM]: [SAND, WHITE, LILAC], [WHITE]: [CREAM],
  [WOOD]: [PEACH, SAND], [PLUM]: [LAV, NIGHT], [RED]: [ROSE]
};

function pts(list) { return list.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '); }
function starPts(cx, cy, ro, ri, n, rot) {
  rot = rot === undefined ? -90 : rot;
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = (rot + i * 180 / n) * Math.PI / 180;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts(p);
}
function sparkle(cx, cy, r, fill) {
  return `<path d="M${cx} ${cy - r} Q${cx} ${cy} ${cx + r} ${cy} Q${cx} ${cy} ${cx} ${cy + r} Q${cx} ${cy} ${cx - r} ${cy} Q${cx} ${cy} ${cx} ${cy - r} Z" fill="${fill || GOLD}" stroke-width="1.6"/>`;
}
function ring(cx, cy, r, fill, sw) { return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke-width="${sw || 2.4}"/>`; }
function blush(x, y) { return `<circle cx="${x}" cy="${y}" r="3.2" fill="${PINK}" stroke="none"/>`; }
function eyes(x1, x2, y) { return `<path d="M${x1 - 3} ${y} q3 3 6 0 M${x2 - 3} ${y} q3 3 6 0" fill="none" stroke-width="2.2"/>`; }
function smile(x, y) { return `<path d="M${x - 3} ${y} q3 3 6 0" fill="none" stroke-width="2"/>`; }
function shine(x, y, w, h) { return `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${h}" fill="${WHITE}" fill-opacity=".55" stroke="none"/>`; }

const MOTIF_NAMES = Object.keys(MOTIFS);

/* Draw one placed object: {m, x, y, s, r, f, a, b, v}. */
function drawObj(o) {
  const M = MOTIFS[o.m];
  if (!M) return '';
  const sx = (o.f ? -1 : 1) * o.s;
  return `<g transform="translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) rotate(${(o.r || 0).toFixed(1)}) scale(${sx.toFixed(3)} ${o.s.toFixed(3)})">${M.draw({ a: o.a, b: o.b, v: o.v || 0 })}</g>`;
}

/* ============================ chapter scenes ============================
   Ten painted backgrounds, one per chapter, in a 360 x 300 picture. Skies are
   layered gradients with turbulence nebulae and glowing stars; surfaces have
   wood grain, velvet folds or water reflections; every picture ends with a
   vignette and film grain (sceneFinish). `draw(p)` takes an id prefix so two
   pictures on one page never share filter or gradient ids.
   Zones say where objects may stand; pools say which motifs belong. */

const PIC_W = 360, PIC_H = 300;

/* ---- paint helpers ---- */
function lin(p, id, stops, x2, y2) {
  return `<linearGradient id="${p}${id}" x1="0" y1="0" x2="${x2 === undefined ? 0 : x2}" y2="${y2 === undefined ? 1 : y2}">` + stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}"${s[2] !== undefined ? ` stop-opacity="${s[2]}"` : ''}/>`).join('') + '</linearGradient>';
}
function rad(p, id, stops, cx, cy, r) {
  return `<radialGradient id="${p}${id}" cx="${cx === undefined ? .5 : cx}" cy="${cy === undefined ? .5 : cy}" r="${r === undefined ? .6 : r}">` + stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}"${s[2] !== undefined ? ` stop-opacity="${s[2]}"` : ''}/>`).join('') + '</radialGradient>';
}
function blurF(p, id, sd) { return `<filter id="${p}${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${sd}"/></filter>`; }
/* cloudy noise tinted with a colour; alpha row turns the noise into soft patches */
function nebulaF(p, id, seed, rgb, freq, oct, contrast, lift) {
  return `<filter id="${p}${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${oct || 4}" seed="${seed}" stitchTiles="stitch"/>`
       + `<feColorMatrix type="matrix" values="0 0 0 0 ${rgb[0]}  0 0 0 0 ${rgb[1]}  0 0 0 0 ${rgb[2]}  0 0 0 ${contrast || 1.8} ${lift === undefined ? -0.55 : lift}"/><feGaussianBlur stdDeviation="2.5"/></filter>`;
}
function nebula(p, id, x, y, w, h, opacity, blend) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" filter="url(#${p}${id})" opacity="${opacity}"${blend ? ` style="mix-blend-mode:${blend}"` : ''}/>`;
}
function grainF(p) {
  return `<filter id="${p}grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .6  0 0 0 .9 -.3"/></filter>`;
}
function rnd(seed) { let t = seed; return () => { t = (t * 9301 + 49297) % 233280; return t / 233280; }; }
function blob(p, x, y, rx, ry, color, opacity, blend, sd) {
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${color}" opacity="${opacity}" filter="url(#${p}b${sd || 18})"${blend ? ` style="mix-blend-mode:${blend}"` : ''}/>`;
}
function glowDot(p, x, y, r, color, opacity) {
  return `<circle cx="${x}" cy="${y}" r="${r * 3}" fill="${color}" opacity="${(opacity || .5) * .6}" filter="url(#${p}b6)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${opacity || .9}"/>`;
}
function starField(p, seed, n, x0, y0, x1, y1, maxR, glowEvery) {
  const R = rnd(seed); let s = '';
  for (let i = 0; i < n; i++) {
    const x = (x0 + R() * (x1 - x0)).toFixed(1), y = (y0 + R() * (y1 - y0)).toFixed(1), r = (0.4 + R() * R() * maxR).toFixed(2), o = (0.35 + R() * .65).toFixed(2);
    if (glowEvery && i % glowEvery === 0) s += `<circle cx="${x}" cy="${y}" r="${(+r * 4).toFixed(1)}" fill="#FFF9FA" opacity="${(+o * .35).toFixed(2)}" filter="url(#${p}b4)"/>`;
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#FFF9FA" opacity="${o}"/>`;
    if (glowEvery && i % (glowEvery * 2) === 1) s += `<path d="M${x} ${+y - 6} L${x} ${+y + 6} M${+x - 6} ${y} L${+x + 6} ${y}" stroke="#FFF9FA" stroke-width=".8" opacity="${(+o * .8).toFixed(2)}"/>`;
  }
  return `<g stroke="none">${s}</g>`;
}
function rays(p, x, y, n, len, color, opacity, spread, rot) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = ((rot || -90) + (i - (n - 1) / 2) * (spread || 12)) * Math.PI / 180, w = 0.05 + (i % 2) * 0.04;
    s += `<path d="M${x} ${y} L${(x + Math.cos(a - w) * len).toFixed(1)} ${(y + Math.sin(a - w) * len).toFixed(1)} L${(x + Math.cos(a + w) * len).toFixed(1)} ${(y + Math.sin(a + w) * len).toFixed(1)} Z" fill="${color}"/>`;
  }
  return `<g opacity="${opacity}" filter="url(#${p}b6)" stroke="none" style="mix-blend-mode:screen">${s}</g>`;
}
function mist(p, y, h, color, opacity) {
  return `<g stroke="none">${blob(p, 90, y, 150, h, color, opacity, null, 18)}${blob(p, 270, y + 6, 160, h * .9, color, opacity * .8, null, 18)}</g>`;
}
function woodF(p, seed) {
  return `<filter id="${p}wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .35" numOctaves="3" seed="${seed || 4}" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .25  0 0 0 0 .12  0 0 0 0 .05  0 0 0 1.3 -.5"/></filter>`;
}
function cloudPuff(p, x, y, w, h, color, opacity) {
  return `<g stroke="none" opacity="${opacity}"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${h}" fill="${color}" filter="url(#${p}b6)"/><ellipse cx="${x - w * .35}" cy="${y - h * .1}" rx="${w * .55}" ry="${h * .9}" fill="${color}" filter="url(#${p}b6)"/><ellipse cx="${x + w * .3}" cy="${y - h * .25}" rx="${w * .5}" ry="${h * 1.1}" fill="${color}" filter="url(#${p}b6)"/><ellipse cx="${x - w * .1}" cy="${y - h * .5}" rx="${w * .4}" ry="${h * .8}" fill="#FFFFFF" opacity=".5" filter="url(#${p}b6)"/></g>`;
}
function bigMoon(p, x, y, r, color) {
  return `<g stroke="none"><circle cx="${x}" cy="${y}" r="${r * 2.6}" fill="${color}" opacity=".18" filter="url(#${p}b18)"/><circle cx="${x}" cy="${y}" r="${r * 1.5}" fill="${color}" opacity=".35" filter="url(#${p}b6)"/>`
       + `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${p}moonG)"/><circle cx="${x - r * .3}" cy="${y - r * .2}" r="${r * .22}" fill="#000" opacity=".06"/><circle cx="${x + r * .35}" cy="${y + r * .3}" r="${r * .16}" fill="#000" opacity=".06"/><circle cx="${x + r * .1}" cy="${y - r * .5}" r="${r * .1}" fill="#000" opacity=".05"/></g>`;
}
const COMMON_DEFS = p => blurF(p, 'b4', 4) + blurF(p, 'b6', 6) + blurF(p, 'b18', 18) + blurF(p, 'b30', 30) + grainF(p)
  + rad(p, 'vig', [[0.55, '#2A1A50', 0], [1, '#2A1A50', .42]], .5, .5, .75)
  + rad(p, 'moonG', [[0, '#FFFBEA'], [.7, '#F6E5B3'], [1, '#E5BE5E']], .38, .34, .75);
/* drawn after the objects: vignette + grain */
function sceneFinish(p) {
  return `<rect width="360" height="300" fill="url(#${p}vig)" stroke="none"/><rect width="360" height="300" filter="url(#${p}grain)" opacity=".16" stroke="none" style="mix-blend-mode:overlay"/>`;
}

    draw(p) {

           + rays(p, 292, 58, 7, 260, '#FFF6D8', .35, 10, 120)
           + cloudPuff(p, 70, 60, 46, 14, '#FFFFFF', .8) + cloudPuff(p, 200, 96, 34, 10, '#FFFFFF', .55)
           + `<g stroke="none"><path d="M0 178 Q100 138 200 172 Q280 196 360 160 L360 300 L0 300 Z" fill="url(#${p}far)"/>`

           + `<g stroke="none">${(() => { const R = rnd(21); let s = ''; for (let i = 0; i < 46; i++) { const x = R() * 360, y = 212 + R() * 88, c = ['#F6BBCB', '#FFFFFF', '#F6E5B3', '#E48AA6'][i % 4]; s += glowDot(p, x.toFixed(1), y.toFixed(1), 1.6 + R() * 1.4, c, .85); } return s; })()}</g>`;

  pond: {

const CHAPTERS = [
  { id: 1, bg: 'meadow', card: { en: 'The Fool', vi: 'Chàng Khờ' }, need: 0 },

/* ============================ level generator ============================
   A level is: a scene, a list of placed objects (picture A), and a list of
   changes that turn A into picture B. The 100 campaign levels are baked once
   from LEVEL_PLAN (tools/bake.py writes src/levels.js) so they never change
   under a player's feet; the same generator makes the daily challenge from
   the date. Everything is seeded and deterministic.

   Level types
     diff    find the differences (the standard rule)
     mirror  same, but picture B is mirrored left-right
     same    bonus stage: almost everything changed, find what stayed the same */

function rng(seed) {
  let t = seed >>> 0;
  return function () {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(R, arr) { return arr[Math.floor(R() * arr.length)]; }
function weighted(R, table) {
  let sum = 0; for (const k in table) sum += table[k];
  let x = R() * sum;
  for (const k in table) { x -= table[k]; if (x <= 0) return k; }
  return Object.keys(table)[0];
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function radius(o) { return (MOTIFS[o.m] ? MOTIFS[o.m].r : 28) * o.s; }
const NOROT = { pentacle: 1, mala: 1, sparkle: 1 };
const UNIQUE = { sun: 1, moon: 1, rainbow: 1, teapot: 1, cat: 1, owl: 1, rabbit: 1, crystalball: 1, dreamcatcher: 1 };

/* ------------------------------------------------------------ plan ---- */
/* Difficulty for level n (1..10) of chapter ch (1..10). */
function planFor(ch, n) {
  let type = 'diff';
  if (n === 5 || (n === 10 && ch % 2 === 0)) type = 'same';
  else if (n === 8 && ch >= 3) type = 'mirror';
  const late = n >= 6 ? 1 : 0, boss = n >= 9 ? 1 : 0;
  let find = Math.min(7, 3 + Math.floor((ch - 1) / 2) + late + boss);
  if (ch === 1) find = [3, 3, 4, 4, 3, 4, 5, 5, 5, 6][n - 1];
  if (type === 'same') find = Math.min(5, 3 + (ch >= 4 ? 1 : 0) + (n === 10 ? 1 : 0));
  let time = 0;
  if (ch >= 3) time = (ch <= 4 ? 150 : ch <= 6 ? 120 : ch <= 8 ? 105 : 90) - n * 3;
  if (type === 'same' && time) time += 30;
  let subtle = ch <= 2 ? 0 : ch <= 4 ? 1 : ch <= 7 ? 2 : 3;
  if (n === 4 || n >= 9) subtle = Math.min(3, subtle + 1);
  const count = Math.min(16, Math.round(6 + ch * 0.7 + n * 0.35 + (type === 'same' ? 1 : 0)));
  const smin = Math.max(0.6, 0.9 - ch * 0.03 - n * 0.01), smax = Math.max(0.9, 1.15 - ch * 0.025);
  return { ch, n, type, bg: CHAPTERS[ch - 1].bg, find, time, subtle, count, smin, smax, miss: time ? 6 : 8, mirror: type === 'mirror' };
}
function planDaily(dayIndex) {
  const R = rng(0xDA11 + dayIndex);
  const ch = 1 + Math.floor(R() * 10);
  const p = planFor(ch, 3 + Math.floor(R() * 6));
  p.type = R() < 0.25 ? 'same' : (R() < 0.3 ? 'mirror' : 'diff');
  p.mirror = p.type === 'mirror';
  p.find = p.type === 'same' ? 4 : Math.min(7, p.find + 1);
  p.time = p.type === 'same' ? 150 : 120;
  p.daily = true;
  return p;
}

/* -------------------------------------------------------- placing ---- */
function zonesFor(scene, motifZone) {
  let z = scene.zones.filter(q => q.z === motifZone);
  if (!z.length) z = scene.zones;
  return z;
}
function inside(zone, x, y, r) {
  return x - r >= zone.x - 12 && x + r <= zone.x + zone.w + 12 && y - r >= zone.y - 12 && y + r <= zone.y + zone.h + 12;
}
function overlaps(objs, cand, skip) {
  const rc = radius(cand);
  for (let i = 0; i < objs.length; i++) {
    if (i === skip || !objs[i]) continue;
    if (dist(objs[i], cand) < radius(objs[i]) + rc + 6) return true;
  }
  return false;
}
function companion(R, a) {
  const c = [GOLD, LILAC, CREAM, PINK, BLUE, PEACH, MINT].filter(x => x !== a);
  return pick(R, c);
}
function placeObjects(R, plan, scene) {
  const objs = [];
  const used = {};
  let tries = 0;
  while (objs.length < plan.count && tries < 400) {
    tries++;
    const m = pick(R, scene.pool);
    const M = MOTIFS[m];
    if (!M) continue;
    if ((used[m] || 0) >= (m === 'zodiac' ? 4 : UNIQUE[m] ? 1 : 2)) continue;
    const zone = pick(R, zonesFor(scene, M.zone));
    const s = plan.smin + R() * (plan.smax - plan.smin);
    const r = M.r * s;
    const a = pick(R, M.nocolor ? [CREAM] : SWATCH.filter(x => x !== CREAM || m === 'cloud'));
    const o = { m, x: 0, y: 0, s: +s.toFixed(3), r: 0, f: 0, a, b: companion(R, a), v: Math.floor(R() * M.vars) };
    let ok = false;
    for (let k = 0; k < 40 && !ok; k++) {
      o.x = Math.round(zone.x + r + R() * Math.max(1, zone.w - 2 * r));
      o.y = Math.round(zone.y + r + R() * Math.max(1, zone.h - 2 * r));
      if (inside(zone, o.x, o.y, r) && !overlaps(objs, o)) ok = true;
    }
    if (!ok) continue;
    if (!M.sym && R() < 0.35) o.f = 1;
    if (!NOROT[m] && R() < 0.3) o.r = Math.round((R() - 0.5) * 24);
    used[m] = (used[m] || 0) + 1;
    objs.push(o);
  }
  return objs;
}

/* ------------------------------------------------------- mutating ---- */
function farColor(R, a) {
  const near = NEAR[a] || [];
  return pick(R, SWATCH.filter(x => x !== a && near.indexOf(x) < 0 && x !== CREAM));
}
function nearColor(R, a) {
  const near = (NEAR[a] || []).filter(x => x !== a);
  return near.length ? pick(R, near) : farColor(R, a);
}
function weightsFor(subtle, strong) {
  if (strong) return { remove: 1, swap: 3, color: 3, variant: 2, scale: 2, flip: 2 };
  return [
    { remove: 3, swap: 3, color: 3, variant: 2, scale: 2, flip: 1 },
    { remove: 2, swap: 2, color: 3, variant: 3, scale: 2, flip: 2, rotate: 1, move: 1 },
    { remove: 1, swap: 1, color: 3, variant: 3, scale: 3, flip: 3, rotate: 2, move: 2 },
    { remove: 1, swap: 1, color: 3, variant: 3, scale: 3, flip: 3, rotate: 3, move: 3 }
  ][subtle];
}
/* Try to make one change to objs[i]; returns the mutation or null. */
function mutate(R, objs, i, scene, plan, kindCount, strong) {
  const o = objs[i], M = MOTIFS[o.m];
  const w = Object.assign({}, weightsFor(plan.subtle, strong));
  if (M.nocolor) delete w.color;
  if (M.vars < 2) delete w.variant;
  if (M.sym) delete w.flip;
  if (NOROT[o.m]) delete w.rotate;
  for (const k in w) if ((kindCount[k] || 0) >= (k === 'remove' ? 1 : 2) && !strong) delete w[k];
  for (let attempt = 0; attempt < 8; attempt++) {
    if (!Object.keys(w).length) return null;
    const k = weighted(R, w);
    if (k === 'color') return { i, k, a: plan.subtle >= 2 && !strong ? nearColor(R, o.a) : farColor(R, o.a) };
    if (k === 'variant') { let v = Math.floor(R() * M.vars); if (v === o.v) v = (v + 1) % M.vars; return { i, k, v }; }
    if (k === 'remove') return { i, k };
    if (k === 'flip') return { i, k };
    if (k === 'rotate') { const d = (plan.subtle >= 2 && !strong ? 22 : 38) * (R() < 0.5 ? -1 : 1); return { i, k, r: o.r + d }; }
    if (k === 'scale') {
      const up = R() < 0.5, f = plan.subtle >= 2 && !strong ? (up ? 1.25 : 0.78) : (up ? 1.4 : 0.66);
      const c = Object.assign({}, o, { s: +(o.s * f).toFixed(3) });
      const zone = zonesFor(scene, M.zone).find(z => inside(z, o.x, o.y, radius(o))) || scene.zones[0];
      if (c.s >= 0.5 && c.s <= 1.5 && inside(zone, c.x, c.y, radius(c)) && !overlaps(objs, c, i)) return { i, k, s: c.s };
      delete w.scale; continue;
    }
    if (k === 'move') {
      const zone = zonesFor(scene, M.zone).find(z => inside(z, o.x, o.y, radius(o))) || scene.zones[0];
      const d = plan.subtle >= 2 && !strong ? 26 : 44;
      let done = null;
      for (let t = 0; t < 24 && !done; t++) {
        const a = R() * Math.PI * 2, c = Object.assign({}, o, { x: Math.round(o.x + Math.cos(a) * d), y: Math.round(o.y + Math.sin(a) * d) });
        if (inside(zone, c.x, c.y, radius(c)) && !overlaps(objs, c, i)) done = { i, k, x: c.x, y: c.y };
      }
      if (done) return done;
      delete w.move; continue;
    }
    if (k === 'swap') {
      const cands = scene.pool.filter(n => n !== o.m && MOTIFS[n] && MOTIFS[n].zone === M.zone && Math.abs(MOTIFS[n].r - M.r) <= 8);
      if (!cands.length) { delete w.swap; continue; }
      const m = pick(R, cands);
      return { i, k, m, v: Math.floor(R() * MOTIFS[m].vars), f: MOTIFS[m].sym ? 0 : o.f };
    }
  }
  return null;
}
/* Picture B = A with the changes applied. */
function applyMuts(objs, muts) {
  const b = objs.map(o => Object.assign({}, o));
  muts.forEach(mu => {
    const o = b[mu.i]; if (!o) return;
    if (mu.k === 'remove') o.gone = 1;
    else if (mu.k === 'color') o.a = mu.a;
    else if (mu.k === 'variant') o.v = mu.v;
    else if (mu.k === 'flip') o.f = o.f ? 0 : 1;
    else if (mu.k === 'rotate') o.r = mu.r;
    else if (mu.k === 'scale') o.s = mu.s;
    else if (mu.k === 'move') { o.x = mu.x; o.y = mu.y; }
    else if (mu.k === 'swap') { o.m = mu.m; o.v = mu.v; o.f = mu.f; }
  });
  return b;
}

/* Choose the objects to hunt for: spread out, preferring big ones. */
function chooseTargets(R, objs, n) {
  const order = objs.map((o, i) => i).sort(() => R() - 0.5);
  const chosen = [];
  let minGap = 90;
  while (chosen.length < n && minGap >= 0) {
    for (const i of order) {
      if (chosen.length >= n) break;
      if (chosen.indexOf(i) >= 0) continue;
      if (chosen.every(j => dist(objs[i], objs[j]) >= minGap)) chosen.push(i);
    }
    minGap -= 15;
  }
  return chosen.sort((a, b) => a - b);
}

function genLevel(plan, seed) {
  const R = rng(seed);
  const scene = SCENES[plan.bg];
  const objs = placeObjects(R, plan, scene);
  const lvl = { ch: plan.ch, n: plan.n, type: plan.type, bg: plan.bg, time: plan.time, miss: plan.miss, objs, muts: [], find: 0, seed };
  if (plan.mirror) lvl.mirror = 1;
  if (plan.daily) lvl.daily = 1;
  const kindCount = {};
  if (plan.type === 'same') {
    const keep = chooseTargets(R, objs, Math.min(plan.find, Math.max(2, objs.length - 3)));
    lvl.keep = keep;
    objs.forEach((o, i) => {
      if (keep.indexOf(i) >= 0) return;
      const mu = mutate(R, objs, i, scene, plan, kindCount, true);
      if (mu) { lvl.muts.push(mu); kindCount[mu.k] = (kindCount[mu.k] || 0) + 1; }
      else { lvl.muts.push({ i, k: 'remove' }); }
    });
    lvl.find = keep.length;
  } else {
    const want = Math.min(plan.find, objs.length);
    const targets = chooseTargets(R, objs, Math.min(objs.length, want + 3));
    for (const i of targets) {
      if (lvl.muts.length >= want) break;
      const mu = mutate(R, objs, i, scene, plan, kindCount, false);
      if (mu) { lvl.muts.push(mu); kindCount[mu.k] = (kindCount[mu.k] || 0) + 1; }
    }
    lvl.find = lvl.muts.length;
  }
  lvl.par = lvl.find * 14 + 16;
  return lvl;
}

/* All hunt targets of a level as {i, x, y, r} (B position included for moves). */
function levelTargets(lvl) {
  if (lvl.targets) return lvl.targets.map(t => ({ i: t.i, x: t.x, y: t.y, r: t.r }));
  const idx = lvl.type === 'same' ? lvl.keep : lvl.muts.map(m => m.i);
  return idx.map(i => {
    const o = lvl.objs[i], mu = lvl.muts.find(m => m.i === i);
    const r = Math.max(20, radius(o));
    const t = { i, x: o.x, y: o.y, r };
    if (mu && mu.k === 'move') { t.x2 = mu.x; t.y2 = mu.y; }
    if (mu && mu.k === 'scale' && mu.s > o.s) t.r = Math.max(20, MOTIFS[o.m].r * mu.s);
    return t;
  });
}

const LEVEL_PLAN = [];
for (let ch = 1; ch <= 10; ch++) for (let n = 1; n <= 10; n++) LEVEL_PLAN.push(planFor(ch, n));

/* Seeds live here so a single level can be re-rolled without touching the others. */
const LEVEL_SEEDS = {};
function bakeAll() {
  return LEVEL_PLAN.map((p, i) => {
    const id = i + 1;
    const lvl = genLevel(p, LEVEL_SEEDS[id] || (7000 + id * 131));
    lvl.id = id;
    return lvl;
  });
}
function dailyLevel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const dayIndex = Math.floor(d.getTime() / 86400000);
  const pool = (typeof DAILY_POOL !== 'undefined' && DAILY_POOL.length) ? DAILY_POOL
             : (LEVELS.length && LEVELS[0].a ? LEVELS : null);
  if (pool) {
    const src = pool[((dayIndex % pool.length) + pool.length) % pool.length];
    const copy = JSON.parse(JSON.stringify(src)); copy.id = 'daily'; copy.date = dateStr; copy.daily = 1; return copy;
  }
  const lvl = genLevel(planDaily(dayIndex), 0xD0 + dayIndex * 7);
  lvl.id = 'daily'; lvl.date = dateStr;
  return lvl;

/* ============================ picture rendering ============================
   Pictures are painted, not stickered: every flat motif colour becomes a soft
   radial gradient (light from the top-left), objects cast a soft shadow,
   luminous things glow, and the scene adds a vignette and a little grain. */

function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt > 0 ? 255 : 0, a = Math.abs(amt);
  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/* Objects with volume: gradient fills, drop shadow, glow. Returns {defs, body}. */
function richObjects(objs, p) {
  let body = '';
  const used = {};
  objs.forEach(o => {
    if (o.gone) return;
    const M = MOTIFS[o.m]; if (!M) return;
    let s = drawObj(o);
    s = s.replace(/fill="(#[0-9A-Fa-f]{6})"/g, (m, h) => { h = h.toUpperCase(); used[h] = 1; return `fill="url(#${p}c${h.slice(1)})"`; });
    const r = radius(o);
    const glow = M.glow ? `<circle cx="${o.x}" cy="${o.y}" r="${(r * 1.15).toFixed(1)}" fill="${M.glow}" opacity=".6" filter="url(#${p}glow)"/>` : '';
    body += glow + `<g filter="url(#${p}sh)">${s}</g>`;
  });
  let defs = `<filter id="${p}sh" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="1" dy="3.5" stdDeviation="2.4" flood-color="#2A1A50" flood-opacity=".38"/></filter>`
           + `<filter id="${p}glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>`;
  for (const h in used) {
    defs += `<radialGradient id="${p}c${h.slice(1)}" cx=".34" cy=".28" r=".9"><stop offset="0" stop-color="${shadeColor(h, .34)}"/><stop offset=".5" stop-color="${h}"/><stop offset="1" stop-color="${shadeColor(h, -.26)}"/></radialGradient>`;
  }
  return { defs, body };
}

function marksSVG(lvl, side, marks) {
  let s = '';
  (marks || []).forEach(t => {
    const x = (side === 'b' && t.x2 !== undefined) ? t.x2 : t.x, y = (side === 'b' && t.y2 !== undefined) ? t.y2 : t.y;
    s += `<circle cx="${x}" cy="${y}" r="${(t.r + 8).toFixed(1)}" fill="none" stroke="${GOLD}" stroke-width="7" opacity=".45"/>`
       + `<circle class="found" cx="${x}" cy="${y}" r="${(t.r + 6).toFixed(1)}" fill="none" stroke="${GOLD}" stroke-width="3.5"/>`
       + `<circle cx="${x}" cy="${y}" r="${(t.r + 6).toFixed(1)}" fill="none" stroke="${INK}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  });
  return s;
}

/* SVG for one picture of a level. side 'a' | 'b'. marks = targets already found. */
function pictureSVG(lvl, side, marks, prefix) {
  const scene = SCENES[lvl.bg];
  const objs = side === 'b' ? applyMuts(lvl.objs, lvl.muts) : lvl.objs;
  const p = (prefix || 'p') + side;
  const rich = richObjects(objs, p);
  const body = scene.draw(p) + `<defs>${rich.defs}</defs>` + rich.body + sceneFinish(p);
  const flip = side === 'b' && lvl.mirror ? ` transform="translate(${PIC_W} 0) scale(-1 1)"` : '';
  return `<svg class="pic" viewBox="0 0 ${PIC_W} ${PIC_H}" xmlns="http://www.w3.org/2000/svg" stroke="${INK}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" data-side="${side}">`
       + `<g${flip}>${body}<g class="marks">${marksSVG(lvl, side, marks)}</g></g></svg>`;
}

/* Photo levels: picture = <img> plus an SVG overlay for rings. Picture B of a
   mirror level is flipped with CSS; the overlay group flips the same way. */
function pictureHTML(lvl, side, marks) {
  if (!lvl.a) return pictureSVG(lvl, side, marks, 'g');
  const flipImg = side === 'b' && lvl.mirror ? ' style="transform:scaleX(-1)"' : '';
  const flip = side === 'b' && lvl.mirror ? ` transform="translate(${PIC_W} 0) scale(-1 1)"` : '';
  return `<img class="ph" src="${side === 'a' ? lvl.a : lvl.b}" alt="" draggable="false"${flipImg}>`
       + `<svg class="pic marks-svg" viewBox="0 0 ${PIC_W} ${PIC_H}" xmlns="http://www.w3.org/2000/svg" data-side="${side}"><g${flip}><g class="marks">${marksSVG(lvl, side, marks)}</g></g></svg>`;
}
function preloadLevel(lvl) { if (lvl && lvl.a) { [lvl.a, lvl.b].forEach(u => { const im = new Image(); im.src = u; }); } }

/* Update only the found-rings of an already drawn picture. */
function refreshMarks(svg, lvl, side, marks) {
  const g = svg.querySelector('g.marks');
  if (g) g.innerHTML = marksSVG(lvl, side, marks);
}

/* Convert a tap on the <svg> element to picture coordinates (mirror undone). */
function tapToPic(svg, lvl, clientX, clientY) {
  const box = svg.getBoundingClientRect();
  let x = (clientX - box.left) / box.width * PIC_W, y = (clientY - box.top) / box.height * PIC_H;
  if (svg.dataset.side === 'b' && lvl.mirror) x = PIC_W - x;
  return { x, y };
}

/* Which unfound target was tapped? Nearest within its hit circle, or null. */
function hitTarget(targets, foundIdx, pt) {
  let best = null, bestD = 1e9;
  targets.forEach(t => {
    if (foundIdx.indexOf(t.i) >= 0) return;
    let d = Math.hypot(pt.x - t.x, pt.y - t.y);
    if (t.x2 !== undefined) d = Math.min(d, Math.hypot(pt.x - t.x2, pt.y - t.y2));
    if (d <= t.r + 10 && d < bestD) { best = t; bestD = d; }
  });
  return best;
}

function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); S = raw ? Object.assign(freshState(), JSON.parse(raw)) : freshState(); }
  catch (e) { S = freshState(); }
  if (!S.daily) S.daily = freshState().daily;
  return S;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function resetAll() { const lang = S.lang, theme = S.theme; S = freshState(); S.lang = lang; S.theme = theme; save(); }

function L() { return S.lang; }
function t(key, vars) {
  const parts = key.split('.');
  let v = STR[S.lang]; for (const p of parts) v = v ? v[p] : undefined;
  if (v === undefined) { v = STR.en; for (const p of parts) v = v ? v[p] : undefined; }
  if (typeof v !== 'string') return key;
  return vars ? v.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m) : v;
}

const THEMES = ['auto', 'light', 'dark', 'pink'];
function applyTheme() {
  let th = S.theme;
  if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', th);

/* ---- dates & formats ---- */
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return todayStr(d); }
function fmtTime(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtMin(ms) { const m = Math.ceil(ms / 60000); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm'; }
function dailyAds() { if (S.daily.ads.date !== todayStr()) S.daily.ads = { date: todayStr(), hints: 0, refills: 0, spins: 0, redraws: 0, gifts: 0 }; return S.daily.ads; }

/* ---- money ---- */
function addStardust(n) { S.stardust = Math.max(0, Math.round(S.stardust + n)); save(); renderHeader(); }
function addMoon(n) { S.moon = Math.max(0, Math.round(S.moon + n)); save(); renderHeader(); }
function addHints(n) { S.hints = Math.max(0, S.hints + n); save(); }
function spendStardust(n) { if (S.stardust < n) { toast(t('notEnough', { c: t('stardust') })); return false; } addStardust(-n); SFX.coin(); return true; }
function spendMoon(n) { if (S.moon < n) { toast(t('notEnough', { c: t('moon') })); go('#/shop'); return false; } addMoon(-n); SFX.coin(); return true; }

/* ---- hearts: regenerate one every CONFIG.heartRegenMin minutes ---- */
function heartsNow() {
  const per = CONFIG.heartRegenMin * 60000;
  if (S.hearts >= CONFIG.heartsMax) { S.heartsAt = Date.now(); return S.hearts; }
  const gained = Math.floor((Date.now() - S.heartsAt) / per);
  if (gained > 0) { S.hearts = Math.min(CONFIG.heartsMax, S.hearts + gained); S.heartsAt = S.hearts >= CONFIG.heartsMax ? Date.now() : S.heartsAt + gained * per; save(); }
  return S.hearts;
}
function heartCountdown() {
  heartsNow();
  if (S.hearts >= CONFIG.heartsMax) return '';
  return fmtMin(S.heartsAt + CONFIG.heartRegenMin * 60000 - Date.now());
}
function useHeart() { heartsNow(); if (S.hearts <= 0) return false; if (S.hearts === CONFIG.heartsMax) S.heartsAt = Date.now(); S.hearts--; save(); renderHeader(); return true; }
function refillHearts() { S.hearts = CONFIG.heartsMax; S.heartsAt = Date.now(); save(); renderHeader(); }

/* ---- progress ---- */
function levelStars(id) { const r = S.levels[id]; return r ? r.stars : 0; }
function totalStars() { let n = 0; for (const k in S.levels) if (k !== 'daily') n += S.levels[k].stars || 0; return n; }
function chapterOpen(ch) { return totalStars() >= CHAPTERS[ch - 1].need; }
function levelOpen(id) {
  const lvl = LEVELS[id - 1]; if (!lvl) return false;
  if (!chapterOpen(lvl.ch)) return false;
  if (lvl.n === 1) return true;
  return levelStars(id - 1) > 0;
}
function nextLevelId() { for (let i = 1; i <= LEVELS.length; i++) if (!levelStars(i) && levelOpen(i)) return i; return LEVELS.length; }
function chapterLevels(ch) { return LEVELS.filter(l => l.ch === ch); }
function chapterStars(ch) { return chapterLevels(ch).reduce((n, l) => n + levelStars(l.id), 0); }
function chapterCleared(ch) { const ls = chapterLevels(ch); return ls.length > 0 && ls.every(l => levelStars(l.id)); }

/* ============================ sounds ============================
   Small synthesised sounds (no audio files): soft, bell-like, never harsh. */
const SFX = (function () {
  let ctx = null;
  function ac() {
    if (!S.sound) return null;
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, when, slide) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, c.currentTime + (when || 0));
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + (when || 0) + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + (when || 0));
    g.gain.exponentialRampToValueAtTime(vol || 0.15, c.currentTime + (when || 0) + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (when || 0) + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + (when || 0)); o.stop(c.currentTime + (when || 0) + dur + 0.05);
  }
  return {
    tap() { tone(660, 0.06, 'triangle', 0.08); },
    found() { tone(784, 0.18, 'sine', 0.16); tone(1175, 0.28, 'sine', 0.14, 0.09); },
    miss() { tone(220, 0.18, 'triangle', 0.1, 0, 160); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'sine', 0.14, i * 0.11)); tone(1319, 0.6, 'sine', 0.12, 0.45); },
    fail() { tone(392, 0.3, 'sine', 0.12); tone(330, 0.45, 'sine', 0.12, 0.25); },
    coin() { tone(1319, 0.08, 'square', 0.05); tone(1760, 0.14, 'square', 0.05, 0.07); },
    tick() { tone(1200, 0.03, 'square', 0.03); },
    chime() { [880, 1108, 1319].forEach((f, i) => tone(f, 0.3, 'sine', 0.1, i * 0.08)); },
    swoosh() { tone(300, 0.25, 'sine', 0.06, 0, 900); }
  };
})();

/* ============================ monetisation adapter ============================
   One small API the game calls; three backends behind it:
     android  the Kotlin wrapper (AdMob rewarded/interstitial + Play Billing)
              exposed as window.NabuAndroid, answering through __nabuNative()
     web      AdSense "Ad Placement API" (H5 games) when CONFIG.adsense is set
     mock     a clearly labelled stand-in so the web preview and tests can run
   Purchases only ever happen on Android (Play Billing). The mock store is on
   only when the page is opened from a file or localhost (developer preview). */
const Monet = {
  backend: 'mock', prices: {}, pending: {}, ready: { rewarded: false, interstitial: false }, privacyRequired: false,
  init() {
    if (window.NabuAndroid) {
      this.backend = 'android';
      try { window.NabuAndroid.queryProducts(); } catch (e) {}
      try { this.privacyRequired = !!window.NabuAndroid.isPrivacyOptionsRequired(); } catch (e) {}
    } else if (CONFIG.adsense && window.adBreak) {
      this.backend = 'web';
    }
    this.mockStore = this.backend === 'mock' && /^(file:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href);
  },
  price(sku) { return this.prices[sku] || CONFIG.priceLabels[sku] || ''; },
  /* rewarded ad: cb(true) only when the user earned the reward */
  reward(placement, cb) {
    S.stats.ads++; save();
    if (this.backend === 'android') {
      this.pending['reward'] = cb;
      try { window.NabuAndroid.showRewarded(placement); } catch (e) { delete this.pending.reward; cb(false); }
      return;
    }
    if (this.backend === 'web') {
      let got = false;
      window.adBreak({ type: 'reward', name: placement,
        beforeReward: showAd => showAd(),
        adViewed: () => { got = true; },
        adDismissed: () => {},
        adBreakDone: () => cb(got) });
      return;
    }
    mockAd(placement, cb);
  },
  interstitial(cb) {
    cb = cb || function () {};
    if (S.adsRemoved) return cb(false);
    if (this.backend === 'android') { this.pending['interstitial'] = cb; try { window.NabuAndroid.showInterstitial(); } catch (e) { cb(false); } return; }
    if (this.backend === 'web') { window.adBreak({ type: 'next', name: 'between_levels', adBreakDone: () => cb(true) }); return; }
    mockAd('interstitial', cb, true);
  },
  buy(sku, cb) {
    if (this.backend === 'android') { this.pending['purchase:' + sku] = cb; try { window.NabuAndroid.buy(sku); } catch (e) { cb(false); } return; }
    if (this.mockStore) {
      modal(`<h2>${esc(t('mockBuy'))}</h2><p class="muted" style="text-align:center">${esc(t('mockBuySub'))}</p><div class="btns two"><button class="btn" data-act="closeModal">${esc(t('cancel'))}</button><button class="btn primary" id="mockok">${esc(t('ok'))} · ${esc(Monet.price(sku))}</button></div>`, { center: true });
      document.getElementById('mockok').onclick = () => { closeModal(); cb(true); };
      return;
    }
    toast(t('storeOff')); cb(false);
  },
  restore(cb) {
    if (this.backend === 'android') { this.pending['restore'] = cb; try { window.NabuAndroid.restore(); } catch (e) { cb([]); } return; }
    cb(S.owned || []);
  },
  showPrivacyOptions() { if (this.backend === 'android') { try { window.NabuAndroid.privacyOptions(); } catch (e) {} } },
  vibrate(ms) { try { if (window.NabuAndroid) window.NabuAndroid.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
};

/* Messages from the Android wrapper. */
window.__nabuNative = function (msg) {
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg || !msg.type) return;
  if (msg.type === 'reward') { const cb = Monet.pending.reward; delete Monet.pending.reward; if (cb) cb(!!msg.ok); }
  else if (msg.type === 'interstitial') { const cb = Monet.pending.interstitial; delete Monet.pending.interstitial; if (cb) cb(!!msg.ok); }
  else if (msg.type === 'purchase') { const cb = Monet.pending['purchase:' + msg.sku]; delete Monet.pending['purchase:' + msg.sku]; if (cb) cb(!!msg.ok); else if (msg.ok) grantPurchase(msg.sku); }
  else if (msg.type === 'products') { (msg.items || []).forEach(p => { Monet.prices[p.sku] = p.price; }); if (location.hash.indexOf('#/shop') === 0) route(); }
  else if (msg.type === 'restore') { const cb = Monet.pending.restore; delete Monet.pending.restore; if (cb) cb(msg.owned || []); }
  else if (msg.type === 'adReady') { Monet.ready.rewarded = !!msg.rewarded; Monet.ready.interstitial = !!msg.interstitial; }
  else if (msg.type === 'privacy') { Monet.privacyRequired = !!msg.required; }
};

/* The stand-in ad: a labelled 5-second screen. Never shown in the Android build. */
function mockAd(placement, cb, short) {
  const secs = short ? 2 : 5;
  const box = document.createElement('div');
  box.className = 'adbox';
  box.innerHTML = `<div class="eyebrow" style="color:#E5BE5E">${esc(t('adTest'))}</div><div class="frame">${icon('ad')}</div><div class="count" id="adcount">${secs}</div><div class="sm" style="opacity:.8">${esc(t('adTestSub'))}</div>`;
  document.body.appendChild(box);
  let n = secs;
  const iv = setInterval(() => {
    n--; const c = document.getElementById('adcount'); if (c) c.textContent = n;
    if (n <= 0) { clearInterval(iv); box.remove(); cb(true); }
  }, window.__fastAds ? 20 : 1000);
}

/* What each product gives. Called after a real or mock purchase. */
function grantPurchase(sku) {
  const K = CONFIG.skus;
  if (sku === K.moon60) addMoon(60);
  else if (sku === K.moon200) addMoon(200);
  else if (sku === K.moon500) addMoon(500);
  else if (sku === K.removeAds) { if (!S.adsRemoved) { S.adsRemoved = true; addMoon(100); } }
  else if (sku === K.starter) { if (!S.starter) { S.starter = true; addMoon(120); addHints(10); } }
  if ((sku === K.removeAds || sku === K.starter) && S.owned.indexOf(sku) < 0) S.owned.push(sku);
  save(); SFX.chime(); toast(t('thanks'));
}

function drawHintBtn() {

}
function tickTimer() {
  const g = GAME; if (!g.on || g.paused || g.over) return;

    g.time--;
    const el = document.getElementById('timer'); if (el) { el.textContent = fmtTime(g.time); el.classList.toggle('low', g.time <= 10); }

function onTap(e) {
  const g = GAME; if (!g.on || g.paused || g.over) return;
  e.preventDefault();
  const wrap = e.currentTarget, svg = wrap.querySelector('svg.pic'); if (!svg) return;
  const pt = tapToPic(svg, g.lvl, e.clientX, e.clientY);
  const hit = hitTarget(g.targets, g.found, pt);
  if (hit) {
    g.found.push(hit.i); S.stats.found++; SFX.found(); Monet.vibrate(20);
    if (g.hintT && g.hintT.i === hit.i) { g.hintT = null; document.querySelectorAll('.mk.hintring').forEach(x => x.remove()); }
    const marks = g.targets.filter(x => g.found.indexOf(x.i) >= 0);

    wrap.appendChild(mk); setTimeout(() => mk.remove(), 600);

    drawStatus();
    if (g.misses >= g.lvl.miss) fail('miss');

}
function showHintRing(tg) {

    wrap.querySelectorAll('.mk.hintring').forEach(x => x.remove());

function useHint() {
  const g = GAME; if (!g.on || g.over || g.paused) return;

/* ---- results ---- */
function starsFor(g) {
  const par = g.lvl.par;
  if (g.elapsed <= par && g.misses <= 1) return 3;
  if (g.elapsed <= par * 1.8 || g.misses <= 3) return 2;
  return 1;
}
function win() {
  const g = GAME; if (g.over) return;
  g.over = true; clearInterval(g.timer); SFX.win(); Monet.vibrate(60);
  const lvl = g.lvl, id = lvl.daily ? 'daily' : lvl.id;
  const stars = starsFor(g);
  const prev = lvl.daily ? null : S.levels[id];
  const first = !prev;
  let base = 10 + 6 * g.targets.length;
  if (lvl.type === 'same') base = Math.round(base * 1.3);
  if (lvl.mirror) base = Math.round(base * 1.2);
  const lines = [[t('reward'), base]];
  let total = base;
  if (stars === 3) { lines.push([t('threeStar'), Math.round(base * 0.5)]); total += Math.round(base * 0.5); }
  if (first && !lvl.daily) { lines.push([t('firstClear'), 20]); total += 20; }
  if (blessingKey() === 'stardust') { const b = Math.round(total * 0.25); lines.push([t('blessingBonus'), b]); total += b; }
  if (blessingActive('double')) { lines.push([t('blessingBonus') + ' ×2', total]); total *= 2; S.blessing.used = 1; }
  let moon = 0;
  if (!lvl.daily) { if (first) moon += 1; if (stars === 3 && (!prev || prev.stars < 3)) moon += 2; }
  if (lvl.daily) { if (S.daily.challenge.date !== todayStr() || !S.daily.challenge.done) { total += 80; moon += 2; lines.push([t('challenge'), 80]); } }
  g.reward = total; g.rewardMoon = moon; g.stars = stars;
  S.stats.played++;
  if (lvl.daily) { S.daily.challenge = { date: todayStr(), done: 1, stars }; }
  else {
    const rec = prev || { stars: 0, best: 0 };
    rec.stars = Math.max(rec.stars, stars);
    g.newBest = !rec.best || g.elapsed < rec.best;
    rec.best = rec.best ? Math.min(rec.best, g.elapsed) : g.elapsed;
    S.levels[id] = rec;
  }
  addStardust(total); if (moon) addMoon(moon);
  S.sinceAd++; save();
  g.chest = !lvl.daily && chapterCleared(lvl.ch) && !S.chests[lvl.ch];
  showResult();
}
function showResult() {
  const g = GAME, lvl = g.lvl;
  const html = `<div class="result"><div class="big">✨</div><h2>${esc(t('win'))}</h2>
    <div class="rs">${[1, 2, 3].map(i => i <= g.stars ? icon('star') : icon('starOff')).join('')}</div>
    <p class="muted" style="text-align:center">${esc(t('stars' + g.stars))} · ${esc(t('time'))} ${fmtTime(g.elapsed)}${g.newBest ? ' · ' + esc(t('newBest')) : ''}<br><span class="faint">${esc(t('par', { t: fmtTime(lvl.par) }))} · ${esc(t('misses'))} ${g.misses}</span></p>
    <div class="card tint" style="margin:8px 0"><div class="kv"><span>${esc(t('reward'))}</span><b>${coin('stardust', g.reward)}${g.rewardMoon ? ' ' + coin('moon', '+' + g.rewardMoon) : ''}</b></div>${g.doubled ? `<div class="kv"><span>${esc(t('doubleAd'))}</span><b>×2</b></div>` : ''}</div>
    ${g.chest ? `<button class="btn gold wide" data-act="gChest">${icon('chest')}${esc(t('chapterDone'))} · ${esc(t('chestGet'))}</button>` : ''}
    <div class="btns" style="margin-top:8px">${!g.doubled ? `<button class="btn pinkish" data-act="gDouble">${icon('ad')}${esc(t('doubleAd'))}</button>` : ''}
    <button class="btn primary big" data-act="gNext">${esc(lvl.daily ? t('back') : t('next'))}</button></div></div>`;
  modal(html, { center: true, noClose: true });
}
function doubleReward() {
  const g = GAME; if (g.doubled) return;
  Monet.reward('double', ok => { if (ok) { g.doubled = true; addStardust(g.reward); SFX.coin(); showResult(); } else toast(t('adFail')); });
}
function openChest() {
  const g = GAME; if (!g.chest) return;
  S.chests[g.lvl.ch] = 1; g.chest = false; addStardust(200); addMoon(10); SFX.chime();
  toast(t('chest') + ': +200 ✦ +10 🌙'); showResult();
}
function nextLevel() {
  const g = GAME; closeModal(); g.on = false;
  const after = () => {
    if (g.lvl.daily) return go('#/daily');
    const nid = g.lvl.id + 1;
    if (nid <= LEVELS.length && levelOpen(nid)) go('#/play?l=' + nid); else go('#/map');
  };

function fail(why) {
  const g = GAME; if (g.over) return;
  g.over = true; clearInterval(g.timer); SFX.fail();

function wheelSVG() {
  let s = `<svg class="wheel" id="wheel" viewBox="-110 -110 220 220" stroke="#3D2A6E" stroke-width="2.2" stroke-linejoin="round">`;

  mendNo() { S.daily.checkin.streak = 0; S.daily.checkin.last = ''; save(); route(); },
  spin: doSpin,
  spinAd() { const ads = dailyAds(); Monet.reward('spin', ok => { if (ok) { ads.spins++; if (S.daily.spins.date !== todayStr()) S.daily.spins = { date: todayStr(), used: 0, extra: 0 }; S.daily.spins.extra = (S.daily.spins.extra || 0) + 1; save(); route(); } else toast(t('adFail')); }); },
  spinMoon() { if (spendMoon(CONFIG.spinMoon)) { if (S.daily.spins.date !== todayStr()) S.daily.spins = { date: todayStr(), used: 0, extra: 0 }; S.daily.spins.extra = (S.daily.spins.extra || 0) + 1; save(); route(); } },
  drawCard() {
    if (S.daily.card.date === todayStr()) return;
    const id = Math.floor(Math.random() * CARDS.length);
    S.daily.card = { date: todayStr(), id, redrawn: 0 }; applyBlessing(CARDS[id]); SFX.chime(); route();
  },
  redrawAd() { const ads = dailyAds(); Monet.reward('redraw', ok => { if (ok) { ads.redraws++; redraw(); } else toast(t('adFail')); }); },
  redrawMoon() { if (spendMoon(CONFIG.redrawMoon)) redraw(); },
  playDaily() { go('#/play?daily=1'); }
});
function redraw() {
  let id = Math.floor(Math.random() * CARDS.length); if (id === S.daily.card.id) id = (id + 1) % CARDS.length;
  S.daily.card = { date: todayStr(), id, redrawn: 1 }; applyBlessing(CARDS[id]); SFX.chime(); route();
}

/* ============================ shop ============================ */
function renderShop() {
  const K = CONFIG.skus, ads = dailyAds();
  const gem = (a, b, s) => `<svg viewBox="0 0 100 100" stroke="#3D2A6E" stroke-width="2.4" stroke-linejoin="round">${drawObj({ m: 'gem', x: 50, y: 50, s: s || 1, r: 0, f: 0, a: a, b: b, v: 0 })}${drawObj({ m: 'moon', x: 78, y: 26, s: 0.32, r: 0, f: 0, a: GOLD, b: GOLD, v: 0 })}</svg>`;
  const pack = (sku, n, art, best) => `<div class="pack">${best ? `<span class="best">${esc(t('packBest'))}</span>` : ''}${art}<b>${esc(t('packMoon', { n }))}</b><button class="btn primary" data-act="buy" data-sku="${sku}">${esc(Monet.price(sku))}</button></div>`;
  return `<h1 style="margin-bottom:4px">${esc(t('shopTitle'))}</h1><p class="muted sm">${esc(t('shopSub'))}</p>
    ${Monet.backend !== 'android' && !Monet.mockStore ? `<p class="faint">${esc(t('storeOff'))}</p>` : ''}
    <div class="eyebrow" style="margin-bottom:8px">${esc(t('moon'))}</div>
    <div class="shopgrid">${pack(K.moon60, 60, gem(LAV, GOLD, 0.9))}${pack(K.moon200, 200, gem(BLUE, GOLD, 1.05), true)}${pack(K.moon500, 500, gem(GOLD, PINK, 1.2))}</div>
    <div class="list" style="margin-top:12px">
      ${S.starter ? '' : `<div class="item">${icon('gift')}<div class="t"><b>${esc(t('packStarter'))}</b><span>${esc(t('packStarterSub'))}</span></div><button class="btn primary" data-act="buy" data-sku="${K.starter}">${esc(Monet.price(K.starter))}</button></div>`}
      <div class="item">${icon('ad')}<div class="t"><b>${esc(t('removeAds'))}</b><span>${esc(t('removeAdsSub'))}</span></div>${S.adsRemoved ? `<span class="chip mint">${esc(t('removed'))}</span>` : `<button class="btn primary" data-act="buy" data-sku="${K.removeAds}">${esc(Monet.price(K.removeAds))}</button>`}</div>
    </div>
    <div class="eyebrow" style="margin:14px 0 8px">${esc(t('hints'))} · ${S.hints}</div>
    <div class="list">
      <div class="item">${icon('hint')}<div class="t"><b>${esc(t('hintPack'))}</b><span>${CONFIG.hintPackStardust} ✦</span></div><button class="btn" data-act="hintsStardust">${esc(t('buyWith', { p: CONFIG.hintPackStardust + ' ✦' }))}</button></div>
      <div class="item">${icon('hint')}<div class="t"><b>${esc(t('hintPack'))}</b><span>${CONFIG.hintPackMoon} 🌙</span></div><button class="btn gold" data-act="hintsMoon">${esc(t('buyWith', { p: CONFIG.hintPackMoon + ' 🌙' }))}</button></div>
      <div class="item">${icon('ad')}<div class="t"><b>+1 ${esc(t('hint'))}</b><span>${esc(t('adGiftLeft', { n: Math.max(0, CONFIG.adHintsPerDay - ads.hints) }))}</span></div><button class="btn pinkish" data-act="hintAd" ${ads.hints >= CONFIG.adHintsPerDay ? 'disabled' : ''}>${esc(t('freeAd'))}</button></div>
    </div>
    <div class="eyebrow" style="margin:14px 0 8px">${esc(t('bonusAd'))}</div>
    <div class="list">
      <div class="item">${icon('stardust')}<div class="t"><b>${esc(t('adGift'))}</b><span>${esc(t('adGiftLeft', { n: Math.max(0, 5 - ads.gifts) }))}</span></div><button class="btn pinkish" data-act="giftAd" ${ads.gifts >= 5 ? 'disabled' : ''}>${esc(t('freeAd'))}</button></div>
      <div class="item">${icon('heart')}<div class="t"><b>${esc(t('hearts'))} ${S.hearts}/${CONFIG.heartsMax}</b><span>${esc(t('adGiftLeft', { n: Math.max(0, CONFIG.adRefillsPerDay - ads.refills) }))} · ${CONFIG.refillMoon} 🌙</span></div><button class="btn pinkish" data-act="heartsAd" ${ads.refills >= CONFIG.adRefillsPerDay || S.hearts >= CONFIG.heartsMax ? 'disabled' : ''}>${esc(t('freeAd'))}</button><button class="btn gold" data-act="heartsMoon" ${S.hearts >= CONFIG.heartsMax ? 'disabled' : ''}>${CONFIG.refillMoon} 🌙</button></div>
    </div>
    <p style="text-align:center;margin-top:16px"><button class="btn ghost" data-act="restore">${esc(t('restore'))}</button></p>`;
}
Object.assign(window.ACTIONS = window.ACTIONS || {}, {
  buy(el) { const sku = el.dataset.sku; Monet.buy(sku, ok => { if (ok) { grantPurchase(sku); route(); } }); },
  hintsStardust() { if (spendStardust(CONFIG.hintPackStardust)) { addHints(CONFIG.hintPack); SFX.chime(); route(); } },
  hintsMoon() { if (spendMoon(CONFIG.hintPackMoon)) { addHints(CONFIG.hintPack); SFX.chime(); route(); } },
  hintAd() { const ads = dailyAds(); if (ads.hints >= CONFIG.adHintsPerDay) return; Monet.reward('hint', ok => { if (ok) { ads.hints++; addHints(1); SFX.chime(); route(); } else toast(t('adFail')); }); },
  giftAd() { const ads = dailyAds(); if (ads.gifts >= 5) return; Monet.reward('gift', ok => { if (ok) { ads.gifts++; addStardust(20); SFX.coin(); route(); } else toast(t('adFail')); }); },
  restore() { Monet.restore(owned => { (owned || []).forEach(sku => { if (S.owned.indexOf(sku) < 0) grantPurchase(sku); }); toast(t('restored')); route(); }); }
});

/* ============================ me: settings ============================ */
function renderMe() {
  const seg = (name, opts, cur) => `<div class="seg">${opts.map(([v, label]) => `<button class="${cur === v ? 'on' : ''}" data-act="set" data-k="${name}" data-v="${v}">${esc(label)}</button>`).join('')}</div>`;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone || !!window.NabuAndroid;
  return `<h1 style="margin-bottom:10px">${esc(t('meTitle'))}</h1>
    <div class="card"><h2>${esc(t('stats'))}</h2>
      <div class="kv"><span>${esc(t('starsLabel'))}</span><b>${starsHTML(3)} ${totalStars()} / ${LEVELS.length * 3}</b></div>
      <div class="kv"><span>${esc(t('statsPlayed'))}</span><b>${S.stats.played}</b></div>
      <div class="kv"><span>${esc(t('statsFound'))}</span><b>${S.stats.found}</b></div>
      <div class="kv"><span>${esc(t('streak'))}</span><b>${S.daily.checkin.streak}</b></div>
      <div class="kv"><span>${esc(t('hints'))}</span><b>${S.hints}</b></div></div>
    <div class="card"><h2>${esc(t('settings'))}</h2>
      <p class="sm muted" style="margin:10px 0 4px">${esc(t('language'))}</p>${seg('lang', [['en', 'English'], ['vi', 'Tiếng Việt']], S.lang)}
      <p class="sm muted" style="margin:10px 0 4px">${esc(t('theme'))}</p>${seg('theme', [['auto', t('themeAuto')], ['light', t('themeLight')], ['dark', t('themeDark')], ['pink', t('themePink')]], S.theme)}
      <p class="sm muted" style="margin:10px 0 4px">${esc(t('sound'))}</p>${seg('sound', [['1', t('on')], ['0', t('off')]], S.sound ? '1' : '0')}</div>
    <div class="card"><h2>${esc(t('about'))}</h2><p class="muted sm" style="margin-top:6px">${esc(t('aboutText'))}</p>
      <div class="list">
        <a class="btn" href="${CONFIG.nabuUrl}" target="_blank" rel="noopener">${esc(t('nabuApp'))}</a>
        <a class="btn" href="#/privacy">${esc(t('privacy'))}</a>
        ${Monet.backend === 'android' ? `<button class="btn" data-act="privacyOptions">${esc(t('privacyOptions'))}</button>` : ''}
        ${standalone ? '' : `<p class="faint" style="text-align:center;margin:4px 0 0">${esc(t('install'))}: Chrome ⋮ → Add to Home screen</p>`}
        <button class="btn ghost" data-act="resetAsk" style="color:var(--err)">${esc(t('reset'))}</button></div>
      <p class="faint" style="text-align:center;margin-top:10px">${esc(t('version'))} ${CONFIG.version} · ${Monet.backend}</p></div>
    ${typeof CREDITS !== 'undefined' && CREDITS.length ? `<div class="card"><h3>${esc(t('photoCredits'))}</h3><p class="faint">${esc(t('photoCreditsSub'))}</p><details><summary class="sm muted">${CREDITS.length} · Pexels</summary><p class="sm" style="margin-top:8px;line-height:1.8">${CREDITS.map(c => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.by)}</a>`).join(' · ')}</p></details></div>` : ''}`;
}
Object.assign(window.ACTIONS = window.ACTIONS || {}, {
  set(el) {
    const k = el.dataset.k, v = el.dataset.v;
    if (k === 'lang') setLang(v);
    else if (k === 'theme') { S.theme = v; save(); applyTheme(); }
    else if (k === 'sound') { S.sound = v === '1'; save(); if (S.sound) SFX.tap(); }
    route();
  },
  privacyOptions() { Monet.showPrivacyOptions(); },
  resetAsk() { modal(`<h2>${esc(t('reset'))}</h2><p class="muted" style="text-align:center">${esc(t('resetSure'))}</p><div class="btns two"><button class="btn" data-act="closeModal">${esc(t('cancel'))}</button><button class="btn primary" data-act="resetDo">${esc(t('ok'))}</button></div>`, { center: true }); },
  resetDo() { resetAll(); closeModal(); go('#/home'); }
});
function renderPrivacy() {
  const P = PRIVACY, lg = S.lang;
  return `<a class="btn ghost" href="#/me">← ${esc(t('back'))}</a><h1 style="margin:8px 0">${esc(P.title[lg])}</h1><p class="faint">${esc(P.updated)}</p><p class="muted">${esc(P.intro[lg])}</p>` + P.sections.map(s => `<div class="card"><h3>${esc(s.h[lg])}</h3><p class="sm" style="margin-top:6px">${esc(s.p[lg])}</p></div>`).join('');
}

/* ============================ boot & routing ============================ */
function parseHash() {
  const h = location.hash || '#/home';
  const [path, q] = h.slice(2).split('?');
  const params = {};
  (q || '').split('&').forEach(kv => { if (!kv) return; const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { screen: path || 'home', params };
}
function route() {
  const { screen, params } = parseHash();
  closeModal();
  if (GAME.on && screen !== 'play') { GAME.on = false; clearInterval(GAME.timer); }
  document.body.classList.toggle('game', screen === 'play');
  renderHeader();
  const main = document.getElementById('main');
  if (screen === 'play') { playLevel(params.daily ? 'daily' : +params.l || nextLevelId()); return; }
  let html = '';
  if (screen === 'map') html = renderMap();
  else if (screen === 'daily') html = renderDaily(params);
  else if (screen === 'shop') html = renderShop();
  else if (screen === 'me') html = renderMe();
  else if (screen === 'privacy') html = renderPrivacy();
  else html = renderHome();
  main.innerHTML = html;
  renderNav(screen === 'privacy' ? 'me' : screen);
  window.scrollTo(0, 0);
  if (GAME.pendingHearts) { const f = GAME.pendingHearts; GAME.pendingHearts = null; heartsModal(f); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = window.ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); SFX.tap(); fn(el, e); }
});
window.ACTIONS.closeModal = closeModal;
/* No pinch zoom or double-tap zoom while playing. */
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 300) e.preventDefault(); lastTouch = now; }, { passive: false });

(function boot() {
  load(); applyTheme(); document.documentElement.lang = S.lang; Monet.init();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  window.addEventListener('hashchange', route);
  setInterval(() => { if (!GAME.on) renderHeader(); }, 30000);
  route();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
