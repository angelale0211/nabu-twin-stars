name: Make upload keystore

# One-time helper: creates the Play upload key in the cloud (no Java on the
# PC). Passwords are generated here and written ONLY into the artifact, never
# into the log. Download the artifact, back it up, then add the secrets
# described in docs/RELEASE.md.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate
        run: |
          set +x
          SP=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          KP=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -v -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SP" -keypass "$KP" -dname "CN=Nabu Tarot, O=Nabu Tarot, C=VN" >/dev/null 2>&1
          base64 -w0 upload.keystore > upload.keystore.b64
          printf 'KEYSTORE_PASS=%s\nKEY_ALIAS=upload\nKEY_PASS=%s\n' "$SP" "$KP" > passwords.txt
          echo "keystore created (passwords are in the artifact only)"
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload.keystore
            upload.keystore.b64
            passwords.txt
          retention-days: 7
