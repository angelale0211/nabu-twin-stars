name: Android

# Builds the Android app in the cloud (no Android Studio needed on the PC).
#  - every push: a debug APK you can sideload (Actions -> run -> Artifacts)
#  - when the four signing secrets exist: a signed release APK + AAB for Play
# Secrets: KEYSTORE_B64 (base64 of the .keystore), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS

on:
  push:
    branches: [main]
    paths: ['android/**', 'img/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }

      - name: Level photos into the app assets
        run: mkdir -p android/app/src/main/assets/www && cp -r img android/app/src/main/assets/www/img
      - name: Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NabuTwinStars-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Signed release (only when secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/upload.keystore
          export KEYSTORE_FILE=/tmp/upload.keystore
          gradle bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        with:
          name: NabuTwinStars-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
